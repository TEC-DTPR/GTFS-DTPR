name: Actualizar GTFS y publicar

on:
  schedule:
    # 10:00 UTC ≈ 06:00–07:00 en Chile continental. Ajusta a gusto.
    - cron: '0 10 * * *'
  workflow_dispatch:        # permite correrlo a mano
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Procesar los 21 GTFS
        run: python scripts/process_gtfs.py

      - name: Armar sitio estático
        run: |
          mkdir -p _site
          cp index.html app.js style.css _site/
          cp -r data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
